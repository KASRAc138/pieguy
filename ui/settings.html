<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PieGuy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav class="rail">
    <svg class="logo" viewBox="0 0 64 64">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>
      <path d="M32 32 L32 4 A28 28 0 1 1 7.8 18 Z" fill="url(#lg)"/>
      <path d="M32 29 L11 15.5 A25 25 0 0 1 29 4.2 Z" fill="url(#lg)" opacity=".55" transform="translate(-2 -2)"/>
      <circle cx="32" cy="32" r="8" fill="#0b0a13"/>
    </svg>
    <button class="nav on" data-page="pie"><span class="ic">🥧</span><span>Pie</span></button>
    <button class="nav" data-page="contacts"><span class="ic">💬</span><span>Chats</span></button>
    <button class="nav" data-page="flows"><span class="ic">🔗</span><span>Flows</span></button>
    <button class="nav" data-page="record"><span class="ic">⏺️</span><span>Record</span></button>
    <button class="nav" data-page="settings"><span class="ic">⚙️</span><span>Settings</span></button>
    <div class="grow"></div>
    <div class="status"><div class="dot"></div><span id="status-txt">Running</span></div>
  </nav>

  <main class="main">
    <header class="top">
      <div>
        <h1 id="page-title">Pie</h1>
        <div class="sub" id="page-sub"></div>
      </div>
      <div class="spacer"></div>
      <div class="saved" id="saved">● All changes saved</div>
      <button class="btn ghost sm" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button class="btn ghost sm" id="redo" title="Redo (Ctrl+Y)">↷</button>
    </header>

    <!-- PIE -->
    <section class="page on" id="page-pie">
      <div class="stage card">
        <div class="stage-head"><div class="tabs" id="pie-tabs"></div></div>
        <div class="crumbs" id="crumbs"></div>
        <div class="pie-wrap"><svg id="pie" viewBox="-300 -300 600 600"></svg></div>
        <div class="stage-foot" id="stage-foot"></div>
      </div>
      <aside class="inspector card" id="inspector"></aside>
    </section>

    <!-- CONTACTS -->
    <section class="page" id="page-contacts">
      <div class="scroll" style="flex:1"><div class="cgrid" id="cgrid"></div></div>
    </section>

    <!-- FLOWS -->
    <section class="page" id="page-flows">
      <div class="list card scroll" id="flow-list"></div>
      <div class="pane card scroll" id="flow-pane"></div>
    </section>

    <!-- RECORD -->
    <section class="page" id="page-record">
      <div class="card scroll" style="flex:1" id="rec-pane"></div>
    </section>

    <!-- SETTINGS -->
    <section class="page" id="page-settings">
      <div class="scroll" style="flex:1"><div class="sgrid" id="sgrid"></div></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
